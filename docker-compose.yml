services:
  postgres:
    image: postgres:16
    container_name: studio-scheduler-postgres
    environment:
      POSTGRES_DB: studio_scheduler
      POSTGRES_USER: studio_scheduler
      POSTGRES_PASSWORD: studio_scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio_scheduler -d studio_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: